<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3Pvalues - Quiz</title>
  <link rel="icon" type="image/png" href="tplogo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    })();
  </script>
  <style>
    :root {
      --bg-outer: #0a0c12;
      --bg: #11141c;
      --text: #d1d5db;
      --card: #1a1f2b;
      --border: #2d3548;
      --accent: #f9b701;
      --accent-dark: #d9a000;
      --question-bg: #171b26;
      --panel-outline: rgba(249, 183, 1, 0.45);
    }
    [data-theme="light"] {
      --bg-outer: #d8dce6;
      --bg: #f4f5f8;
      --text: #1f2937;
      --card: #ffffff;
      --border: #d1d5db;
      --accent: #d9a000;
      --accent-dark: #b8860b;
      --question-bg: #ffffff;
      --panel-outline: rgba(217, 160, 0, 0.55);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Lexend', system-ui, sans-serif;
      background: var(--bg-outer);
      color: var(--text);
      min-height: 100vh;
    }
    .page-wrapper {
      max-width: 920px;
      margin: 0 auto;
      background: var(--bg);
      min-height: 100vh;
      box-shadow: 0 0 40px rgba(0,0,0,0.35);
      border-left: 2px solid var(--panel-outline);
      border-right: 2px solid var(--panel-outline);
      padding: 5rem 1.5rem 3rem;
    }
    .brand-fixed {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 18, 26, 0.85);
      padding: 8px 12px 8px 8px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
    }
    [data-theme="light"] .brand-fixed {
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    .brand-fixed img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      display: block;
    }
    .brand-text {
      color: #f3f4f6;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    [data-theme="light"] .brand-text {
      color: #111827;
    }
    .theme-toggle {
      margin-left: 2px;
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .theme-toggle:hover {
      border-color: var(--accent);
      background: rgba(249, 183, 1, 0.12);
    }
    .quiz-container {
      max-width: 740px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }
    .question-header {
      margin-bottom: 2rem;
    }
    .question-number {
      font-size: 1.55rem;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 1rem;
      letter-spacing: 0.4px;
    }
    [data-theme="light"] .question-number {
      color: #4b5563;
    }
    .question-box {
      background: var(--question-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.8rem 2rem;
      margin: 0 auto 3rem;
      max-width: 100%;
      box-shadow: 0 6px 22px rgba(0,0,0,0.25);
    }
    h2#questionText {
      font-size: 1.95rem;
      font-weight: 500;
      line-height: 1.45;
      color: #f0f4ff;
    }
    [data-theme="light"] h2#questionText {
      color: #111827;
    }
    #answers {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin: 0 auto 2rem;
      max-width: 460px;
    }
    .answer-btn {
      font-family: 'Lexend', sans-serif;
      font-size: 1.12rem;
      font-weight: 600;
      color: white;
      padding: 0.9rem 1.6rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      letter-spacing: 0.2px;
    }
    .answer-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .answer-btn:active {
      transform: translateY(0);
    }
    #btn-strong-agree   { background: #2e7d32; }
    #btn-agree          { background: #4caf50; }
    #btn-neutral        { background: #757575; }
    #btn-disagree       { background: #ef5350; }
    #btn-strong-disagree{ background: #d32f2f; }
    #btn-back {
      font-family: 'Lexend', sans-serif;
      font-size: 1.05rem;
      font-weight: 500;
      color: #9ca3af;
      background: transparent;
      border: 1px solid var(--border);
      padding: 0.8rem 1.8rem;
      border-radius: 999px;
      margin-top: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    [data-theme="light"] #btn-back {
      color: #4b5563;
    }
    #btn-back:hover {
      background: rgba(249, 183, 1, 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }
    #btn-back:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #btn-back:disabled:hover {
      background: transparent;
      border-color: var(--border);
      color: #9ca3af;
    }
    @media (max-width: 960px) {
      .page-wrapper {
        max-width: 100%;
        box-shadow: none;
        border-left: none;
        border-right: none;
      }
    }
    @media (max-width: 640px) {
      .page-wrapper {
        padding: 4.5rem 1rem 2.5rem;
      }
      h2#questionText {
        font-size: 1.5rem;
      }
      .question-number {
        font-size: 1.25rem;
      }
      .answer-btn {
        font-size: 1.05rem;
        padding: 0.85rem 1.3rem;
      }
      .brand-fixed {
        top: 14px;
        left: 14px;
        padding: 6px 10px 6px 6px;
      }
      .brand-fixed img {
        width: 46px;
        height: 46px;
      }
      .brand-text {
        font-size: 1.2rem;
      }
      .theme-toggle {
        width: 32px;
        height: 32px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="brand-fixed">
    <img src="tplogo.png" alt="3Pvalues Logo">
    <span class="brand-text">3Pvalues</span>
    <button class="theme-toggle" id="themeToggle" title="Toggle light / dark mode" aria-label="Toggle theme">🌙</button>
  </div>

  <div class="page-wrapper">
    <div class="quiz-container">
      <div class="question-header">
        <div class="question-number" id="questionNumber"></div>
      </div>
      <div class="question-box">
        <h2 id="questionText"></h2>
      </div>
      <div id="answers">
        <button id="btn-strong-agree"    class="answer-btn" onclick="answer(2)">Strongly Agree</button>
        <button id="btn-agree"           class="answer-btn" onclick="answer(1)">Agree</button>
        <button id="btn-neutral"         class="answer-btn" onclick="answer(0)">Neutral / Unsure</button>
        <button id="btn-disagree"        class="answer-btn" onclick="answer(-1)">Disagree</button>
        <button id="btn-strong-disagree" class="answer-btn" onclick="answer(-2)">Strongly Disagree</button>
      </div>
      <button id="btn-back" onclick="goBack()">Back</button>
    </div>
  </div>

  <script src="questions.js"></script>
  <script>
    function shuffle(array) {
      let currentIndex = array.length;
      while (currentIndex !== 0) {
        let randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
      }
      return array;
    }
    if (localStorage.getItem("shuffleQuestions") === "true") {
      shuffle(questions);
    }

    let currentQuestion = 0;
    let scores = {
      interference: 0,
      ownership: 0,
      tradition: 0,
      faith: 0
    };
    let answersHistory = [];

    function showQuestion() {
      if (currentQuestion >= questions.length) {
        localStorage.setItem("scores", JSON.stringify(scores));
        window.location.href = "results.html";
        return;
      }
      let q = questions[currentQuestion];
      document.getElementById("questionNumber").innerText =
        `Question ${currentQuestion + 1} of ${questions.length}`;
      document.getElementById("questionText").innerText = q.text;
      document.getElementById("btn-back").disabled = (currentQuestion === 0);
      let prev = answersHistory[currentQuestion];
      if (prev !== undefined) {
        highlightSelected(prev);
      } else {
        clearHighlight();
      }
    }

    function highlightSelected(value) {
      clearHighlight();
      let btnId;
      if (value === 2)    btnId = "btn-strong-agree";
      else if (value === 1)  btnId = "btn-agree";
      else if (value === 0)  btnId = "btn-neutral";
      else if (value === -1) btnId = "btn-disagree";
      else if (value === -2) btnId = "btn-strong-disagree";
      if (btnId) {
        document.getElementById(btnId).style.boxShadow = "0 0 0 4px rgba(249, 183, 1, 0.45)";
      }
    }

    function clearHighlight() {
      document.querySelectorAll(".answer-btn").forEach(btn => {
        btn.style.boxShadow = "0 4px 14px rgba(0,0,0,0.3)";
      });
    }

    function answer(value) {
      let q = questions[currentQuestion];
      if (answersHistory[currentQuestion] !== undefined) {
        scores[q.axis] -= answersHistory[currentQuestion] * q.direction;
      }
      answersHistory[currentQuestion] = value;
      scores[q.axis] += value * q.direction;
      currentQuestion++;
      showQuestion();
    }

    function goBack() {
      if (currentQuestion > 0) {
        currentQuestion--;
        showQuestion();
      }
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("theme", theme);
      const btn = document.getElementById("themeToggle");
      if (btn) btn.textContent = theme === "light" ? "☀️" : "🌙";
    }
    (function initTheme() {
      const saved = localStorage.getItem("theme") || "dark";
      applyTheme(saved);
      const btn = document.getElementById("themeToggle");
      if (btn) {
        btn.onclick = () => {
          const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
          applyTheme(next);
        };
      }
    })();

    showQuestion();
  </script>
</body>
</html>
